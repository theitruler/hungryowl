# Install after replacing hungryowl.example.com and provisioning its TLS certificate.
# The app listens on loopback only. Never expose port 3000 publicly.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
server {
    listen 80;
    server_name hungryowl.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name hungryowl.example.com;
    ssl_certificate /etc/letsencrypt/live/hungryowl.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hungryowl.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 6m;
    client_body_timeout 15s;
    # Nearby request URLs contain coordinates. Do not retain them in access logs.
    access_log off;
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        client_max_body_size 32k;
        include /etc/nginx/snippets/hungryowl-proxy.conf;
    }
    location / {
        include /etc/nginx/snippets/hungryowl-proxy.conf;
    }
}
