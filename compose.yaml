services:
  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - stall-photos:/app/data/uploads
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 60s
      timeout: 15s
      start_period: 30s
      retries: 3
  migrate:
    build:
      context: .
      target: migrator
    profiles: ["tools"]
    env_file: .env.production
    volumes:
      - stall-photos:/app/data/uploads
    environment:
      UPLOAD_DIR: /app/data/uploads
volumes:
  stall-photos:
